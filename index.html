<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="white" />
    <script>
      ;(() => {
        let theme = 'system'
        try {
          theme = localStorage.getItem('ourtaiko-net-theme') || 'system'
        } catch {}
        const dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.add(dark ? 'scheme-dark' : 'scheme-light')
        // Each song source has its colours; set before the first paint.
        const source = location.pathname.split('/')[1]
        if (source === 'fanmade' || source === 'official')
          document.documentElement.dataset.source = source
      })()
    </script>
    <meta name="description" content="OurTaiko：太鼓自制谱社区与官方谱面数据库" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <title>OurTaiko</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
