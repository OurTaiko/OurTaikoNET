name: Deploy OurTaikoNet

# Tests what a push changed and publishes it. The backend is an image, kept in ourtaiko-private
# for rollback; the website (web/) is a build the backend serves from the server's disk. A push
# that changes both publishes the backend first and the website only after it. The game's online
# rooms are part of the backend's image, and their container is replaced only when their own code
# changed: rooms live in memory.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rooms:
        description: Replace the rooms' container too (waits for the rounds under way)
        type: boolean
        default: false

permissions:
  contents: read

# Do not interrupt an in-progress server publish when another commit arrives.
concurrency:
  group: net-production
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.parts.outputs.backend }}
      website: ${{ steps.parts.outputs.website }}
      rooms: ${{ steps.parts.outputs.rooms }}
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: See which parts the push changed
        id: parts
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ROOMS_ASKED: ${{ inputs.rooms }}
        run: |
          # A run started by hand, or a push whose previous commit is not known, does both. The
          # rooms are replaced by hand only when asked; a push of unknown extent may hold them.
          backend=true website=true rooms=true
          if [[ "$EVENT" != push && "$ROOMS_ASKED" != true ]]; then rooms=false; fi
          if [[ "$EVENT" == push && "$BEFORE" =~ ^[0-9a-f]{40}$ && "$BEFORE" != 0000000000000000000000000000000000000000 ]] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            backend=false website=false rooms=false
            while IFS= read -r file; do
              # What cmd/rooms is built from, and how its container is defined. cmd/rooms has a
              # test that it depends on nothing else of this repository.
              case "$file" in
                *_test.go | *.md) ;;
                cmd/rooms/* | internal/multiplay/* | deploy/compose.production.yml) rooms=true ;;
              esac
              # The AOCI index (aoci*.txt, .aoci/) is read by coding agents only: no build, test
              # or image uses it.
              case "$file" in
                *.md | aoci*.txt | .aoci/* | .github/workflows/rollback.yml) ;;
                contracts/* | .github/workflows/deploy.yml) backend=true website=true ;;
                web/* | deploy/publish-web.sh) website=true ;;
                *) backend=true ;;
              esac
            done < <(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "website=$website" >> "$GITHUB_OUTPUT"
          echo "rooms=$rooms" >> "$GITHUB_OUTPUT"
          echo "Backend: $backend, website: $website, rooms: $rooms"

  test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # A throwaway server for the tests: each test makes and drops its own database.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The Dockerfile's test stage has Go and the tools the release image has (tjaparser,
      # ffmpeg, cwebp), so the suite runs as the server will run the code.
      - name: Build the test image
        run: docker build --target test -t ourtaiko-net-test .

      - name: Run every test
        run: >-
          docker run --rm --network host
          -e DATABASE_TEST_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres
          ourtaiko-net-test

  test-website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package the build
        run: |
          test -f dist/index.html
          tar -C dist -czf web.tar.gz .

      # The tested build is the one deploy-website publishes.
      - name: Keep the build for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: web/web.tar.gz
          retention-days: 7
          if-no-files-found: error

  deploy-backend:
    needs: [changes, test-backend, test-website]
    # Publishing is switched on per repository (Settings > Variables: DEPLOY_ENABLED=true).
    # Until then a push only runs the tests. Nothing is published unless every test that ran
    # passed.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
      && needs.changes.outputs.backend == 'true'
      && needs.test-backend.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.test-website.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -t ourtaiko-net:${{ github.sha }} .

      - name: Package the image
        id: image
        run: |
          docker save ourtaiko-net:${{ github.sha }} | gzip -1 > net-image.tar.gz
          digest=$(sha256sum net-image.tar.gz)
          echo "sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
          # Sent beside the image, so the server needs no checkout of this repository.
          cp deploy/compose.production.yml compose.production.yml

      - name: Get AWS credentials for ourtaiko-private
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # The shared IAM user for ourtaiko-private (organization secrets).
          aws-access-key-id: ${{ secrets.PRIVATE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PRIVATE_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      # Every published image stays here for rollback.yml; the server keeps only the
      # running one.
      - name: Archive the image in ourtaiko-private
        run: >-
          aws s3 cp net-image.tar.gz "s3://ourtaiko-private/net/images/${{ github.sha }}.tar.gz"
          --metadata "sha256=${{ steps.image.outputs.sha256 }}" --only-show-errors

      - name: Validate deployment secrets
        env:
          SERVER_ADDR: ${{ secrets.SERVER_ADDR }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_FINGERPRINT: ${{ secrets.DEPLOY_FINGERPRINT }}
        run: |
          # SERVER_ADDR is the organization's; the rest are this repository's.
          for name in SERVER_ADDR DEPLOY_USER DEPLOY_KEY DEPLOY_FINGERPRINT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Upload the image and the Compose file
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          version: '1.8.1'
          host: ${{ secrets.SERVER_ADDR }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          source: net-image.tar.gz,compose.production.yml
          target: ${{ secrets.DEPLOY_BASE_PATH || '/opt/ourtaiko-net' }}/incoming/${{ github.sha }}
          command_timeout: 15m

      - name: Prepare the publish script from this commit
        # Explicitly use Bash regardless of the SSH user's default shell.
        run: |
          {
            printf "bash -se <<'NET_PUBLISH_SCRIPT'\n"
            cat deploy/publish.sh
            printf '\nNET_PUBLISH_SCRIPT\n'
          } > "$RUNNER_TEMP/publish-net.sh"

      - name: Publish over SSH
        uses: appleboy/ssh-action@91f3272fc5907f4699dcf59761eb622a07342f5a # v1.2.3
        env:
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_BASE_PATH: ${{ secrets.DEPLOY_BASE_PATH }}
          DEPLOY_IMAGE_SHA256: ${{ steps.image.outputs.sha256 }}
          DEPLOY_ROOMS: ${{ needs.changes.outputs.rooms }}
        with:
          host: ${{ secrets.SERVER_ADDR }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          version: '1.8.1'
          # Up to 20 minutes of it is the rounds under way ending, when the rooms are replaced.
          command_timeout: 30m
          envs: DEPLOY_REVISION,DEPLOY_BASE_PATH,DEPLOY_IMAGE_SHA256,DEPLOY_ROOMS
          script_path: ${{ runner.temp }}/publish-net.sh

  deploy-website:
    needs: [changes, test-backend, test-website, deploy-backend]
    # After the backend, when the push changed both: the website may call what it just got.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
      && needs.changes.outputs.website == 'true'
      && needs.test-website.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.test-backend.result)
      && contains(fromJSON('["success", "skipped"]'), needs.deploy-backend.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Get the tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website

      - name: Check the build
        id: web
        run: |
          digest=$(sha256sum web.tar.gz)
          echo "sha256=${digest%% *}" >> "$GITHUB_OUTPUT"

      - name: Validate deployment secrets
        env:
          SERVER_ADDR: ${{ secrets.SERVER_ADDR }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_FINGERPRINT: ${{ secrets.DEPLOY_FINGERPRINT }}
        run: |
          # SERVER_ADDR is the organization's; the rest are this repository's.
          for name in SERVER_ADDR DEPLOY_USER DEPLOY_KEY DEPLOY_FINGERPRINT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Upload the build
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          version: '1.8.1'
          host: ${{ secrets.SERVER_ADDR }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          source: web.tar.gz
          target: ${{ secrets.DEPLOY_BASE_PATH || '/opt/ourtaiko-net' }}/incoming-web/${{ github.sha }}
          command_timeout: 10m

      - name: Prepare the publish script from this commit
        # Explicitly use Bash regardless of the SSH user's default shell.
        run: |
          {
            printf "bash -se <<'NET_WEB_PUBLISH_SCRIPT'\n"
            cat deploy/publish-web.sh
            printf '\nNET_WEB_PUBLISH_SCRIPT\n'
          } > "$RUNNER_TEMP/publish-net-web.sh"

      - name: Publish over SSH
        uses: appleboy/ssh-action@91f3272fc5907f4699dcf59761eb622a07342f5a # v1.2.3
        env:
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_BASE_PATH: ${{ secrets.DEPLOY_BASE_PATH }}
          DEPLOY_WEB_SHA256: ${{ steps.web.outputs.sha256 }}
        with:
          host: ${{ secrets.SERVER_ADDR }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          version: '1.8.1'
          command_timeout: 10m
          envs: DEPLOY_REVISION,DEPLOY_BASE_PATH,DEPLOY_WEB_SHA256
          script_path: ${{ runner.temp }}/publish-net-web.sh
