name: Deploy OurTaikoNetWeb

# Checks and builds the website and makes the build the current one on the server. The
# backend (OurTaikoNet) serves it and is released on its own: release the backend first when
# a change needs both.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt an in-progress server publish when another commit arrives.
concurrency:
  group: net-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          package_json_file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Publishing is switched on per repository (Settings > Variables: DEPLOY_ENABLED=true),
      # once the server is ready for it. Until then a push stops here, checked and built.

      - name: Package the build
        if: vars.DEPLOY_ENABLED == 'true'
        id: web
        run: |
          test -f dist/index.html
          tar -C dist -czf web.tar.gz .
          digest=$(sha256sum web.tar.gz)
          echo "sha256=${digest%% *}" >> "$GITHUB_OUTPUT"

      - name: Validate deployment secrets
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          SERVER_ADDR: ${{ secrets.SERVER_ADDR }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_FINGERPRINT: ${{ secrets.DEPLOY_FINGERPRINT }}
        run: |
          # SERVER_ADDR is the organization's; the rest are this repository's.
          for name in SERVER_ADDR DEPLOY_USER DEPLOY_FINGERPRINT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          # Signing in takes a key or a password.
          if [[ -z "$DEPLOY_KEY" && -z "$DEPLOY_PASSWORD" ]]; then
            echo "::error::Set DEPLOY_KEY (a private key) or DEPLOY_PASSWORD"
            exit 1
          fi

      - name: Upload the build
        if: vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          version: '1.8.1'
          host: ${{ secrets.SERVER_ADDR }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          key: ${{ secrets.DEPLOY_KEY }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          source: web.tar.gz
          target: ${{ secrets.DEPLOY_BASE_PATH || '/opt/ourtaiko-net' }}/incoming-web/${{ github.sha }}
          command_timeout: 10m

      - name: Prepare the publish script from this commit
        if: vars.DEPLOY_ENABLED == 'true'
        # Explicitly use Bash regardless of the SSH user's default shell.
        run: |
          {
            printf "bash -se <<'NET_WEB_PUBLISH_SCRIPT'\n"
            cat deploy/publish.sh
            printf '\nNET_WEB_PUBLISH_SCRIPT\n'
          } > "$RUNNER_TEMP/publish-net-web.sh"

      - name: Publish over SSH
        if: vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/ssh-action@91f3272fc5907f4699dcf59761eb622a07342f5a # v1.2.3
        env:
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_BASE_PATH: ${{ secrets.DEPLOY_BASE_PATH }}
          DEPLOY_WEB_SHA256: ${{ steps.web.outputs.sha256 }}
        with:
          host: ${{ secrets.SERVER_ADDR }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          key: ${{ secrets.DEPLOY_KEY }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          version: '1.8.1'
          command_timeout: 10m
          envs: DEPLOY_REVISION,DEPLOY_BASE_PATH,DEPLOY_WEB_SHA256
          script_path: ${{ runner.temp }}/publish-net-web.sh
