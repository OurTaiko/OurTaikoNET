<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="white" />
    <script>
      ;(() => {
        let theme = 'system'
        try {
          theme = localStorage.getItem('ourtaiko-net-theme') || 'system'
        } catch {}
        const dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.add(dark ? 'scheme-dark' : 'scheme-light')
        // Each song source has its colours; set before the first paint. The pages of no source
        // wear the accent the player chose (src/kit/accent.ts keeps this in step afterwards).
        const source = location.pathname.split('/')[1]
        let tone = 'don'
        if (source === 'fanmade' || source === 'official') {
          document.documentElement.dataset.source = source
          if (source === 'fanmade') tone = 'ka'
        } else {
          try {
            if (localStorage.getItem('ourtaiko-net-accent') === 'ka') tone = 'ka'
          } catch {}
        }
        document.documentElement.dataset.tone = tone
      })()
    </script>
    <!-- The site's own words, for readers that do not run the script; each page then puts its
         own here (src/kit/head.tsx). -->
    <meta
      name="description"
      content="OurTaikoNET：太鼓自制谱面社区。试听、下载玩家创作的自制谱面，分享歌单，挑战段位道场，记录你的成绩与称号。"
    />
    <meta property="og:site_name" content="OurTaikoNET" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OurTaikoNET" />
    <meta
      property="og:description"
      content="OurTaikoNET：太鼓自制谱面社区。试听、下载玩家创作的自制谱面，分享歌单，挑战段位道场，记录你的成绩与称号。"
    />
    <meta property="og:image" content="https://net.ourtaiko.org/icons/icon-512.png" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <title>OurTaikoNET</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
