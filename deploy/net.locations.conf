# The proxy settings of net.ourtaiko.org, and after the switch of fanmade.ourtaiko.org,
# database.ourtaiko.org and profile.ourtaiko.org as well: the one server answers all four
# (the old ones by their Host header, see internal/legacy).
#
# 1Panel keeps each site's proxy in /opt/1panel/www/sites/<host>/proxy/root.conf, which the
# site's server block includes; this file is installed as that one, in place of what 1Panel
# writes. It is one location with everything inside, like 1Panel's own, so the panel still
# reads it. Editing the proxy in the panel writes its own file over this one.
#
# No add_header here: the server block's (Strict-Transport-Security) would stop applying.
location ^~ / {
    # A chart with its audio and video; the server enforces the exact limits.
    client_max_body_size 112m;
    client_body_timeout 180s;

    proxy_pass http://127.0.0.1:8096;
    proxy_http_version 1.1;

    # The old host names are told apart by this.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The address this proxy saw, not a list the client can add to: limits go by it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 180s;
    proxy_read_timeout 240s;

    proxy_request_buffering off;
    proxy_buffering off;
}
