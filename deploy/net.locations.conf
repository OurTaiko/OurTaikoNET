# Include inside the server block of net.ourtaiko.org, and after the switch inside those of
# fanmade.ourtaiko.org, database.ourtaiko.org and profile.ourtaiko.org as well: the one
# server answers all four (the old ones by their Host header, see internal/legacy).
client_max_body_size 112m;
client_body_timeout 180s;
add_header X-Content-Type-Options nosniff always;

location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    # The old host names are told apart by this.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 180s;
    proxy_read_timeout 240s;
    proxy_request_buffering off;
    proxy_buffering off;
}
