# Multi-Enso, the game's online rooms: gRPC over HTTP/2, passed on to the port the container
# maps for it (deploy/compose.production.yml). For net.ourtaiko.org only, the address the game
# is told to dial; the old host names do not need it.
#
# Installed beside the site's proxy file (deploy/net.locations.conf, there root.conf) as
# /opt/1panel/www/sites/net.ourtaiko.org/proxy/multiplay.conf: the site's server block
# includes every .conf of that folder. It is a file of its own because the panel reads each
# proxy file as one location; it may list this one as a second proxy, and saving it there
# writes the panel's own (proxy_pass) over it.
#
# The server block must listen with HTTP/2 (`http2 on;`, or `listen 443 ssl http2;`): gRPC
# is nothing else. A stream stays open for a whole session, so the timeouts are long; the
# container pings every 30 s and the game about as often, and a stream that is gone is
# found by those.
#
# The longest prefix wins, so this is chosen over `location ^~ /`.
location ^~ /ourtaiko.multiplay.v1.MultiEnso/ {
    grpc_pass grpc://127.0.0.1:8097;
    grpc_set_header X-Real-IP $remote_addr;
    grpc_connect_timeout 5s;
    grpc_read_timeout 1h;
    grpc_send_timeout 1h;
    client_body_timeout 1h;
    # nginx counts everything a stream has sent against this limit (1m unless set): a
    # session must not end because it has lasted long. The service itself refuses any one
    # message over 64 KiB.
    client_max_body_size 0;
}
