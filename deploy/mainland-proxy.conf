# The site's address in mainland China, otnet.sakura-bot.cn: a server there whose nginx passes
# everything to net.ourtaiko.org in Los Angeles, so a visitor's connection ends close by and
# only this server crosses the ocean, over connections it keeps open. The site answers it as
# one of its own addresses (APP_OTHER_ORIGINS; deploy/README.md, "The address in mainland
# China"): its own sign-in, its own session cookies, writes only from its own pages.
#
# This is the server block of that host on the mainland server, as it is or pasted into the
# panel that manages it. The certificate and key are that server's, for otnet.sakura-bot.cn.
# Files (songs, art, the web player) do not come this way: a mainland visitor already gets
# them from the mirror (deploy/aliyun-mirror.md).

# Connections to Los Angeles, kept open between requests: every request does not pay for a
# TCP and TLS handshake across the ocean.
upstream ourtaiko_net_origin {
    server net.ourtaiko.org:443;
    keepalive 16;
    keepalive_timeout 60s;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Multi-Enso is gRPC, which is HTTP/2 only.
    http2 on;
    server_name otnet.sakura-bot.cn;

    ssl_certificate     /path/to/otnet.sakura-bot.cn/fullchain.pem;
    ssl_certificate_key /path/to/otnet.sakura-bot.cn/privkey.pem;

    # A chart with its audio and video; the server enforces the exact limits.
    client_max_body_size 112m;
    client_body_timeout 180s;

    # Multi-Enso, the game's online rooms (deploy/net.multiplay.conf there). The game is told
    # to dial the address it asked at, so this one when it asked here.
    location ^~ /ourtaiko.multiplay.v1.MultiEnso/ {
        grpc_pass grpcs://ourtaiko_net_origin;
        grpc_ssl_server_name on;
        grpc_ssl_name net.ourtaiko.org;
        grpc_ssl_verify on;
        grpc_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_connect_timeout 10s;
        grpc_read_timeout 1h;
        grpc_send_timeout 1h;
        client_body_timeout 1h;
        client_max_body_size 0;
    }

    location / {
        proxy_pass https://ourtaiko_net_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # TLS to Los Angeles under its own name, whose certificate is checked; the request
        # keeps this host name, which tells the site which of its addresses was asked.
        proxy_ssl_server_name on;
        proxy_ssl_name net.ourtaiko.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_session_reuse on;
        proxy_set_header Host $host;
        # The visitor, not this server: the proxy in Los Angeles believes it from this server's
        # address alone (set_real_ip_from there) and passes it on.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 240s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name otnet.sakura-bot.cn;
    return 301 https://$host$request_uri;
}
