# The OurTaikoNet containers on the production server: the site (net) and the game's online
# rooms (rooms), one image with two programs. The publish script puts this file at
# /opt/ourtaiko-net/compose.production.yml with every release, and replaces each container only
# when its part changed: rooms live in memory, so the site is released without touching them.
name: ourtaiko-net
services:
  net:
    image: ourtaiko-net:release
    container_name: ourtaiko-net
    restart: unless-stopped
    env_file:
      # Kept on the server only; deploy/api.env.example lists what goes in them.
      - path: /etc/ourtaiko-net/docker/api.env
        format: raw
      - path: /etc/ourtaiko-net/docker/storage.env
        format: raw
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      STORAGE_DIR: /tmp/staging
      # STORAGE_BACKEND comes from storage.env: `public` (read-only) until the switch (see
      # deploy/README.md, "Files before the switch"), `s3` from then on.
      # The website's current release (deploy/publish-web.sh puts releases beside each other
      # and points `current` at one).
      WEB_DIR: /srv/web/current
      # Multi-Enso, the game's online rooms, is the container below. The site answers its
      # questions here, on the private network `rooms` (nothing maps this port), and tells the
      # game to dial MULTIPLAY_PUBLIC_URL, by default APP_ORIGIN.
      #
      # To switch the rooms off, comment the next line out: the site then answers 404 at
      # /api/v1/game/multiplay and the game does not try.
      MULTIPLAY_INTERNAL_ADDR: 0.0.0.0:8082
      # Not in this container any more, whatever api.env says.
      MULTIPLAY_LISTEN_ADDR: ''
    # On this server 8080 is Fanmade's, 8081 Database's, 8090 the account center's, 8093
    # Profile's and 8094-8095 another site's. 8096 is the API and the website; 8097 is
    # Multi-Enso (the container below). A port that is taken on the server stops the container
    # from starting.
    ports: ['127.0.0.1:8096:8080']
    volumes:
      - /opt/ourtaiko-net/web:/srv/web:ro
      # Optional GeoIP files for the regional Don mirror. Enabled via api.env.
      - /opt/ourtaiko-net/geoip:/srv/geoip:ro
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=1g']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/readyz']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    # The proxy on the host reaches 8096 from the gateway of the container's gateway network, and
    # TRUSTED_PROXY_CIDRS in api.env names that gateway (172.20.0.1, ourtaiko-shared's). Without
    # a priority Docker picks the network first by name (`rooms`), so `shared` is pinned as the
    # gateway network here. gw_priority needs Docker Engine 28 and Compose 2.33.1 or later.
    networks:
      shared: {gw_priority: 1}
      rooms: {}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  # Multi-Enso. No database and no secrets: it asks the site (internal/multiplay/roomsapi). The
  # proxy passes /ourtaiko.multiplay.v1.MultiEnso/ on to 8097 (deploy/net.multiplay.conf).
  rooms:
    image: ourtaiko-net-rooms:release
    container_name: ourtaiko-net-rooms
    entrypoint: [ourtaiko-rooms]
    restart: unless-stopped
    environment:
      MULTIPLAY_LISTEN_ADDR: 0.0.0.0:8081
      MULTIPLAY_ADMIN_ADDR: 127.0.0.1:8083
      MULTIPLAY_SITE_INTERNAL_URL: http://net:8082
    ports: ['127.0.0.1:8097:8081']
    read_only: true
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8083/healthz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [rooms]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  shared: {external: true, name: ourtaiko-shared}
  rooms: {}
