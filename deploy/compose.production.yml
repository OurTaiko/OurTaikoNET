# The one OurTaikoNet container on the production server. The publish script puts this file
# at /opt/ourtaiko-net/compose.production.yml with every release.
name: ourtaiko-net
services:
  net:
    image: ourtaiko-net:release
    container_name: ourtaiko-net
    restart: unless-stopped
    env_file:
      # Kept on the server only; deploy/api.env.example lists what goes in them.
      - path: /etc/ourtaiko-net/docker/api.env
        format: raw
      - path: /etc/ourtaiko-net/docker/storage.env
        format: raw
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      STORAGE_DIR: /tmp/staging
      # STORAGE_BACKEND comes from storage.env: `public` (read-only) until the switch (see
      # deploy/README.md, "Files before the switch"), `s3` from then on.
      # The website's current release (deploy/publish-web.sh puts releases beside each other
      # and points `current` at one).
      WEB_DIR: /srv/web/current
      # Multi-Enso, the game's online rooms: gRPC in clear text on a port of its own. The
      # proxy passes /ourtaiko.multiplay.v1.MultiEnso/ on to it (deploy/net.multiplay.conf).
      # The game is told to dial MULTIPLAY_PUBLIC_URL, by default APP_ORIGIN.
      #
      # On since 2026-11-14 (deploy/README.md, "Multi-Enso (gRPC)"). To switch it off, comment
      # the next line out: the site then answers 404 at /api/v1/game/multiplay and the game
      # does not try. The second port may stay mapped.
      MULTIPLAY_LISTEN_ADDR: 0.0.0.0:8081
    # On this server 8080 is Fanmade's, 8081 Database's, 8090 the account center's, 8093
    # Profile's and 8094-8095 another site's. 8096 is the API and the website; 8097 is
    # Multi-Enso (nothing else listened there on 2026-11-14). A port that is taken on the
    # server stops the container from starting.
    ports: ['127.0.0.1:8096:8080', '127.0.0.1:8097:8081']
    volumes:
      - /opt/ourtaiko-net/web:/srv/web:ro
      # Optional GeoIP files for the regional Don mirror. Enabled via api.env.
      - /opt/ourtaiko-net/geoip:/srv/geoip:ro
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=1g']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/readyz']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [shared]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  shared: {external: true, name: ourtaiko-shared}
